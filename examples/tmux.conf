# fbtodo in the tmux status line: progress at a glance, no pane, no split.
# Append these two lines to ~/.tmux.conf and reload (`tmux source-file ~/.tmux.conf`).
#
# `bar` prints one short string — "todos 3/5" — or nothing at all when no session is being
# followed, which is why it is safe to leave in a status line permanently. It reads the
# cached state file (not the transcript), so it is cheap enough to run every few seconds.
#
# Set FBTODO_NO_PANE=1 in your shell if you want the status line and nothing else.

set -g status-interval 5
set -g status-right "#(~/.local/bin/fbtodo bar)  %H:%M"
