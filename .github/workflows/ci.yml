name: ci

# Both suites, on both platforms the pane claims to support, on the oldest Python it
# promises (3.9) and the newest. The suites are the contract: `scripts/fbtodo-selfcheck.py`
# drives private tmux servers and a throwaway FBTODO_HOME, and
# `scripts/notify/test-freebuff-notify.sh` drives the bells with stubbed senders, so nothing
# here touches a real session or phone.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  suites:
    name: ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.x"]
    env:
      # The pane is drawn for a UTF-8 256-colour terminal; without this a runner's locale
      # is C and the frame's glyph checks would report a locale they do not have.
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      TERM: xterm-256color
      FBTODO_NO_AUTOSTART: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: install tmux, lsof and zsh (Linux)
        if: runner.os == 'Linux'
        # zsh is part of the contract: the shell-integration check runs `/bin/zsh -i` and the
        # notify suite sources functions from it. Ubuntu runners do not ship it.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tmux lsof zsh

      - name: install tmux (macOS)
        if: runner.os == 'macOS'
        run: command -v tmux >/dev/null || brew install tmux

      - name: what the runner has
        run: |
          python3 -V
          tmux -V || true
          python3 fbtodo doctor || true

      - name: self-check
        run: |
          set +e
          bash .github/ci-timeout.sh 720 selfcheck.log python3 scripts/fbtodo-selfcheck.py
          rc=$?
          bash .github/ci-report.sh self-check selfcheck.log "$rc"
          exit "$rc"

      - name: notify suite
        run: |
          set +e
          bash .github/ci-timeout.sh 1200 notify.log bash scripts/notify/test-freebuff-notify.sh
          rc=$?
          bash .github/ci-report.sh notify-suite notify.log "$rc"
          exit "$rc"

  # Two ordinary conditions the main matrix masks. A Linux host with no `lsof` is every
  # container and busybox box: `/proc` answers cwd on its own there, and `doctor` must
  # warn about the missing binary rather than fail. A C locale is a cron job or a service
  # unit: the frame still draws, so neither suite may depend on the runner's locale.
  no-lsof:
    name: ubuntu · py3.x · no lsof
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      TERM: xterm-256color
      FBTODO_NO_AUTOSTART: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: install tmux and zsh, and make sure lsof is gone
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tmux zsh
          sudo apt-get remove -y -qq lsof || true

      - name: prove lsof is absent
        run: |
          if command -v lsof >/dev/null; then
            echo "lsof is on PATH but this leg needs it absent" >&2
            exit 1
          fi
          echo "lsof: absent; /proc is present"

      - name: doctor warns about the missing lsof, not fails
        run: |
          python3 fbtodo doctor --json > /tmp/doctor.json
          python3 -c 'import json,sys; d=json.load(open("/tmp/doctor.json")); sys.exit(0 if d["fail"]==0 else 1)'

      - name: self-check
        run: |
          set +e
          bash .github/ci-timeout.sh 720 selfcheck.log python3 scripts/fbtodo-selfcheck.py
          rc=$?
          bash .github/ci-report.sh self-check selfcheck.log "$rc"
          exit "$rc"

      - name: notify suite
        run: |
          set +e
          bash .github/ci-timeout.sh 1200 notify.log bash scripts/notify/test-freebuff-notify.sh
          rc=$?
          bash .github/ci-report.sh notify-suite notify.log "$rc"
          exit "$rc"

  c-locale:
    name: ubuntu · py3.x · LANG=C
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LANG: C
      LC_ALL: C
      TERM: xterm-256color
      FBTODO_NO_AUTOSTART: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: install tmux, lsof and zsh
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tmux lsof zsh

      - name: where the locale is now
        run: |
          locale || true
          python3 -c 'import sys; print("stdout encoding:", sys.stdout.encoding)'

      - name: self-check
        run: |
          set +e
          bash .github/ci-timeout.sh 720 selfcheck.log python3 scripts/fbtodo-selfcheck.py
          rc=$?
          bash .github/ci-report.sh self-check selfcheck.log "$rc"
          exit "$rc"

      - name: notify suite
        run: |
          set +e
          bash .github/ci-timeout.sh 1200 notify.log bash scripts/notify/test-freebuff-notify.sh
          rc=$?
          bash .github/ci-report.sh notify-suite notify.log "$rc"
          exit "$rc"
